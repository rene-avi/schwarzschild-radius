<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090b" />
    <meta name="description" content="An interactive black hole observatory. Bend light, cross the stars, and explore the edge of time." />
    <title>Event Horizon — A study in gravity</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2308090b'/%3E%3Ccircle cx='20' cy='20' r='10' fill='none' stroke='%23e8b780' stroke-width='2'/%3E%3Cellipse cx='20' cy='20' rx='18' ry='4' fill='none' stroke='%23e8b780'/%3E%3C/svg%3E" />
  </head>
  <body>
    <style>
      #boot-status { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; padding: 32px; background: #08090b; color: #e8e6df; font: 16px/1.7 Arial, sans-serif; }
      #boot-status[hidden] { display: none; }
      #boot-status h1 { color: #e9ad75; font: 500 22px/1.5 Arial, sans-serif; letter-spacing: 3px; }
      #boot-status p { max-width: 560px; margin: 8px 0; }
      #boot-status details { max-width: 560px; margin-top: 20px; color: #a5a5a3; font-size: 12px; overflow-wrap: anywhere; }
    </style>
    <section id="boot-status" role="status" aria-live="polite">
      <h1>EVENT HORIZON</h1>
      <p id="boot-message">Starting the observatory…</p>
      <noscript><p>JavaScript is disabled. Enable JavaScript in your browser to run the simulation.</p></noscript>
      <details id="boot-details" hidden><summary>Startup details</summary><p id="boot-error"></p></details>
    </section>
    <script data-boot-guard>
      (function () {
        var panel = document.getElementById('boot-status');
        var failed = false;
        var started = false;
        var timer;
        function fail(message, detail) {
          failed = true;
          clearTimeout(timer);
          panel.hidden = false;
          document.getElementById('boot-message').textContent = message;
          if (detail) {
            document.getElementById('boot-details').hidden = false;
            document.getElementById('boot-error').textContent = String(detail);
          }
        }
        window.eventHorizonBoot = {
          ready: function () {
            if (failed) return;
            started = true;
            clearTimeout(timer);
            panel.hidden = true;
          },
          fail: fail
        };
        window.addEventListener('error', function (event) {
          if (started) return;
          fail('The simulation could not start. Please share the startup details below.', event.message || 'A required script could not be loaded.');
        });
        window.addEventListener('unhandledrejection', function (event) {
          if (started) return;
          fail('The simulation could not start. Please share the startup details below.', event.reason && event.reason.message || event.reason);
        });
        timer = setTimeout(function () {
          if (!started && !failed) document.getElementById('boot-message').textContent = 'Still starting. If this message remains, open the complete Event-Horizon.html file in an up-to-date browser with WebGL 2 enabled.';
        }, 15000);
      }());
    </script>
    <main id="observatory" aria-label="Interactive black hole simulation">
      <canvas id="universe" aria-label="Black hole viewport. Drag to orbit; scroll to zoom." tabindex="0"></canvas>
    </main>
    <script data-local-launcher>
      if (location.protocol === 'file:') {
        location.replace(new URL('./dist/index.html', location.href));
      } else {
        const entry = document.createElement('script');
        entry.type = 'module';
        entry.src = '/src/main.js';
        document.body.append(entry);
      }
    </script>
  </body>
</html>
